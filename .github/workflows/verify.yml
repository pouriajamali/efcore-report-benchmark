name: Build and verify recorded evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Locked audited restore
        run: dotnet restore Benchmark/Benchmark.csproj --locked-mode
      - name: Release build
        run: dotnet build Benchmark/Benchmark.csproj -c Release --no-restore
      - name: Verify recorded local evidence
        run: python3 scripts/verify_evidence.py | tee evidence-verification.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-verification
          path: evidence-verification.txt
          if-no-files-found: error
